[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guandan-server"
version = "0.1.0"
description = "Authoritative Python server foundation for Guandan."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "rich>=13.7",
  "textual>=0.89",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
guandan-cli = "client.cli:main"
guandan-server = "server.server:main"
guandan-bc-collect = "training.collect:main"
guandan-bc-cache = "training.bc_cache:main"
guandan-bc-train = "training.bc_train:main"
guandan-ppo-train = "training.ppo_train:main"
guandan-rl-agent-server = "npc.rl_agent.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]
train = [
  "torch>=2.3",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]

[tool.setuptools]
packages = [
  "common",
  "client",
  "client.tui",
  "db",
  "db.player",
  "server",
  "server.api",
  "server.app",
  "server.controllers",
  "server.domain",
  "server.persistence",
  "server.services",
  "npc",
  "npc.common",
  "npc.dummy_bot",
  "npc.llm_agent",
  "npc.rl_agent",
  "training",
]

[tool.setuptools.package-dir]
common = "common"
client = "client"
"client.tui" = "client/tui"
db = "db"
"db.player" = "db/player"
server = "server"
"server.api" = "server/api"
"server.app" = "server/app"
"server.controllers" = "server/controllers"
"server.domain" = "server/domain"
"server.persistence" = "server/persistence"
"server.services" = "server/services"
npc = "npc"
"npc.common" = "npc/common"
"npc.dummy_bot" = "npc/dummy_bot"
"npc.llm_agent" = "npc/llm_agent"
"npc.rl_agent" = "npc/rl_agent"
training = "training"

[tool.pytest.ini_options]
testpaths = ["tests", "npc"]
pythonpath = ["."]
