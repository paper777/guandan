[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guandan-server"
version = "0.1.0"
description = "Authoritative Python server foundation for Guandan."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
guandan-cli = "client.cli:main"
guandan-server = "server.server:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]

[tool.setuptools]
packages = [
  "client",
  "server",
  "server.api",
  "server.app",
  "server.controllers",
  "server.domain",
  "server.persistence",
  "server.services",
  "npc",
  "npc.broker",
  "npc.common",
  "npc.dummy_bot",
]

[tool.setuptools.package-dir]
client = "client"
server = "server"
"server.api" = "server/api"
"server.app" = "server/app"
"server.controllers" = "server/controllers"
"server.domain" = "server/domain"
"server.persistence" = "server/persistence"
"server.services" = "server/services"
npc = "npc"
"npc.broker" = "npc/broker"
"npc.common" = "npc/common"
"npc.dummy_bot" = "npc/dummy_bot"

[tool.pytest.ini_options]
testpaths = ["server/tests", "npc"]
pythonpath = ["."]
