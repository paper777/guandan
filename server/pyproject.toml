[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "guandan-server"
version = "0.1.0"
description = "Authoritative Python server foundation for Guandan."
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "hypothesis>=6",
]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["guandan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
